spring:
  application:
    name: desafiotecnico

  datasource:
    url: jdbc:postgresql://localhost:5433/desafiotecnico
    username: desafiotecnico
    password: desafiotecnico
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080
